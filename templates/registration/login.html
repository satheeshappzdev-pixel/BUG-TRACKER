<!DOCTYPE html>
<html>
<head>
    <title>Sign In - Bug Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --glass-bg: rgba(255,255,255,0.25); }
        body {
            font-family: 'Google Sans', sans-serif;
            background: linear-gradient(135deg, #161719 0%, #323034 100%);
            min-height: 100vh;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .input-group-text {
            border-radius: 12px 0 0 12px !important;
        }
        .form-control {
            border-radius: 0 12px 12px 0 !important;
        }
        .btn-primary {
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="glass-card shadow-lg p-4">
                        <div class="text-center mb-5">
                            <div class="bg-primary rounded-circle mx-auto mb-3 p-4 d-inline-block">
                                <span class="material-icons text-white fs-1">login</span>
                            </div>
                            <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
                            <p class="text-white-50 mb-0">Sign in to your Bug Tracker account</p>
                        </div>

                        <form method="post" novalidate>
                            {% csrf_token %}

                            {% if form.non_field_errors %}
                            <div class="alert alert-danger">
                                {% for error in form.non_field_errors %}
                                    <div>{{ error }}</div>
                                {% endfor %}
                            </div>
                            {% endif %}

                            <div class="mb-4">
                                <label class="form-label text-white fw-bold mb-2">Email or Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <span class="material-icons small">person</span>
                                    </span>
                                    <input type="text"
                                           name="username"
                                           class="form-control border-start-0 ps-1"
                                           placeholder="Enter email or username"
                                           required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-white fw-bold mb-2">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <span class="material-icons small">lock</span>
                                    </span>
                                    <input type="password"
                                           name="password"
                                           class="form-control border-start-0 ps-1"
                                           placeholder="Enter your password"
                                           required>
                                </div>
                            </div>

                            <button type="submit"
                                    class="btn btn-light text-primary w-100 py-3 fw-bold d-flex justify-content-center align-items-center">
                                <span class="material-icons me-2">login</span>
                                Sign In
                            </button>
                        </form>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-white-50">
                            © 2026 Bug Tracker. All rights reserved.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
